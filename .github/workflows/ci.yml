name: 🛡️ CI

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancels stale runs when new commits land on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- BUILD, VET, TEST (cross-platform: this ships as a binary for all three) ---
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # Build and test the way the product ships: a fully static, cgo-free
      # binary (Constitution Art. 5.1, "single static binary, no runtime").
      # This also fixes the macOS runner: crypto/x509 pulls cgo in on darwin,
      # and the resulting cgo test binary is built without an LC_UUID load
      # command, which the macOS dynamic linker refuses to run ("missing
      # LC_UUID ... signal: abort trap"). CGO_ENABLED=0 uses Go's internal
      # linker, which always emits LC_UUID.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: 🛡️ Build
        run: go build ./...

      - name: 🔍 Vet
        run: go vet ./...

      - name: 🧪 Test (coverage, all platforms)
        # Quoted on purpose: Windows runs this step in pwsh, which splits an
        # unquoted -coverprofile=coverage.out at the dot and hands go test
        # "-coverprofile=coverage" and ".out". The profile then lands in a file
        # named "coverage" and the floors step finds nothing to read.
        run: go test ./... "-coverprofile=coverage.out"

      - name: Coverage floors (Art. 4.2)
        shell: pwsh
        run: ./.github/scripts/check-coverage.ps1

      # The race detector needs cgo + a C compiler. Run it on Linux only: cgo
      # test binaries build and run cleanly there. Windows has no default C
      # compiler, and a cgo binary on the macOS runner hits the LC_UUID/dyld
      # issue noted above. Cross-platform functional coverage is already done by
      # the cgo-free test step above; data races are OS-independent, so Linux
      # race coverage exercises the shared concurrency paths; platform-specific
      # races still require a supported runner to investigate.
      - name: 🏁 Test (race detector, Linux)
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race

  # --- LINT & FORMAT (single OS: text-content checks, no need to repeat 3x) ---
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 📐 Format check (gofmt)
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_diff"
            exit 1
          fi

      - name: 🧹 golangci-lint
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.15.0

  # --- SECURITY AUDIT ---
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history so Gitleaks can scan every new commit

      - name: 🕵️ Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: 🛑 govulncheck (Go vulnerability DB, call-graph aware)
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1

      - name: 🛡️ Trivy Scan (Filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  # --- SAST: CodeQL (source code analysis, not just dependencies) ---
  codeql-sast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: go

      - name: 🔬 CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: "/language:go"
          # Findings go to the repository's Security tab. That needs GitHub
          # Advanced Security, which is free on public repos; while this one was
          # private the results were written to a plain artifact instead, which
          # nobody reads. The repo went public with v0.1.0, so the workaround is
          # gone and the findings land where GitHub actually surfaces them.

  # --- CONTAINER SCANNING: N/A ---
  # Ganimedes ships as a binary, not a Docker image, so there is nothing to
  # build and scan here (unlike CryptoCapi's backend/collector images).

  # Approval HTTP handlers are covered by hermetic tests. A real-browser smoke
  # remains a separate manual check; no browser E2E job runs in this workflow.
