name: 🚀 Release

# Two ways in:
#
#   * push a tag `vX.Y.Z`  -> build, verify, and publish a GitHub Release.
#   * workflow_dispatch    -> build and verify only, artifacts land in the run
#                             summary and nothing is published. This exists so a
#                             broken release pipeline is discovered on a dry run
#                             instead of at tag time, when the tag already exists.
#
# Cutting a release is therefore a deliberate manual act (creating the tag), not
# something that happens on a merge.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never abort a half-published release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the Release and upload its assets
      id-token: write # Sigstore signs the attestation against this run's OIDC token
      attestations: write # record the provenance statement against the repository
    env:
      # Ship exactly what CI tested: a fully static, cgo-free binary
      # (Constitution Art. 5.1). Cross-compiling is free for us precisely
      # because cgo is off, so the whole matrix builds on one runner.
      CGO_ENABLED: "0"
      MODULE: github.com/Jegoba90/Ganimedes-Project
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The version string is the tag itself on a tag push. On a manual dry run
      # there is no tag, so the binaries are marked as the dev build they are:
      # a release artifact never silently claims a version it does not have
      # (Art. 2.4).
      - name: 🏷️ Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="0.0.0-dev+$(git rev-parse --short HEAD)"
          fi
          # The filename prefix is derived once, here, because three later steps
          # need it (build, verify, checksums) and each runs in its own shell.
          # Naming the artifacts in three places would let them drift apart.
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prefix=ganimedes_${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      # CI already ran the full three-OS gate on `main`. This is the last line of
      # defence: never cut artifacts from code whose tests were not run at the
      # exact commit being shipped (Art. 4.3, no bypass).
      - name: 🧪 Test the exact commit being shipped
        run: |
          set -euo pipefail
          go vet ./...
          go test ./... -cover

      # The linker ignores an -X for a symbol it cannot find: no error, no
      # warning, the value simply stays at its default. A rename or a package
      # move would therefore ship "0.0.0-dev" binaries in total silence. Assert
      # the symbols exist first, against an unstripped build (the release build
      # uses -s -w, which removes the symbol table nm reads).
      - name: 🔎 Guard - the stamped symbols still exist
        run: |
          set -euo pipefail
          probe="${RUNNER_TEMP}/ganimedes-symprobe"
          symbols="${RUNNER_TEMP}/ganimedes-symbols.txt"
          go build -o "${probe}" ./cmd/ganimedes
          # nm's output lands in a file instead of a pipe into grep. `grep -q`
          # exits at its first match, the SIGPIPE that follows kills nm, and
          # `pipefail` then reports the whole pipeline as failed even though the
          # symbol was found: the guard fired precisely when the symbol existed.
          # Writing it as a pipe survived local verification because Windows has
          # no SIGPIPE, so only a Linux runner could surface it.
          go tool nm "${probe}" > "${symbols}"
          for sym in "${MODULE}/internal/cli.version" "${MODULE}/internal/scan.clientVersion"; do
            if ! grep -qF " ${sym}" "${symbols}"; then
              echo "::error::symbol ${sym} not found; the -ldflags -X in this workflow would be silently ignored"
              exit 1
            fi
            echo "ok: ${sym}"
          done

      - name: 🔨 Cross-compile
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREFIX: ${{ steps.version.outputs.prefix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # -trimpath strips local filesystem paths so the binary does not carry
          # the runner's directory layout. -s -w drops the symbol table and DWARF
          # data: smaller download, and nothing a user needs to run it.
          ldflags="-s -w"
          ldflags="${ldflags} -X ${MODULE}/internal/cli.version=${VERSION}"
          ldflags="${ldflags} -X ${MODULE}/internal/scan.clientVersion=${VERSION}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "${goos}" = "windows" ]; then ext=".exe"; fi
            out="dist/${PREFIX}_${goos}_${goarch}${ext}"
            echo "==> ${out}"
            GOOS="${goos}" GOARCH="${goarch}" go build \
              -trimpath \
              -ldflags "${ldflags}" \
              -o "${out}" \
              ./cmd/ganimedes
          done
          ls -l dist

      # Claim nothing that was not checked (Art. 2.4). The runner is
      # linux/amd64, so that one binary can be executed here to prove the
      # stamping actually worked instead of assuming the linker flag took.
      - name: ✅ Verify the built binary reports this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREFIX: ${{ steps.version.outputs.prefix }}
        run: |
          set -euo pipefail
          got="$("./dist/${PREFIX}_linux_amd64" version)"
          want="ganimedes ${VERSION}"
          echo "got:  ${got}"
          echo "want: ${want}"
          [ "${got}" = "${want}" ]

      # Users of a security tool must be able to check what they downloaded
      # (Art. 5.2). Checksums cover the binaries themselves, not an archive, so
      # what you verify is exactly the file you execute.
      - name: 🔐 Checksums
        env:
          PREFIX: ${{ steps.version.outputs.prefix }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum "${PREFIX}"_* > SHA256SUMS
          cat SHA256SUMS

      # A checksum proves the download matches what was published, and nothing
      # more: SHA256SUMS sits on the same page as the binaries, so whoever can
      # replace one can replace both. The attestation breaks that circle. It is
      # a signed statement, held in Sigstore's transparency log and GitHub's API
      # rather than in the release, that these exact bytes came out of this
      # workflow, at this commit, in this repository, so a user verifies the
      # download without having to trust the page they got it from.
      #
      # Keyless: Sigstore issues a short-lived certificate against this run's
      # OIDC token, so there is no signing key to hold, rotate or leak. That is
      # why this lands now while binary signing stays deferred (`INFRA.md` §3).
      #
      # What it does not say: nothing about the code being correct or benign. It
      # proves origin, not safety, and the docs must not blur the two (Art. 2.4).
      #
      # Runs on dry runs as well as tags, deliberately. The one lesson this
      # pipeline has already taught is that a step gated on tags is a step
      # nobody has ever run.
      - name: 🧾 Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          # The six binaries, by the same prefix the rest of the workflow uses.
          # SHA256SUMS is left out on purpose: it is a convenience file, and the
          # attestation covers what a user actually executes.
          subject-path: dist/${{ steps.version.outputs.prefix }}_*

      # Kept for dry runs and as a fallback copy of what a tag published.
      - name: 📦 Upload artifacts to the run
        uses: actions/upload-artifact@v4
        with:
          name: ganimedes-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 14

      # Not gated on tags: a dry run renders the notes too, and prints them, so
      # the last step before publishing is not also the least rehearsed one.
      # What changed in a release is written by hand, per version, in
      # docs/release-notes/<tag>.md, and spliced in below. Hand-written and
      # versioned alongside the code it describes: no changelog generator, which
      # `INFRA.md` §3 rules out, and no notes that live only in a web form.
      - name: 📝 Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Ganimedes ${VERSION}: a local, zero-dependency security gateway for MCP servers.
          EOF

          notes="docs/release-notes/${VERSION}.md"
          if [ -f "${notes}" ]; then
            # Copied verbatim rather than expanded, so the notes can hold
            # backticks and dollar signs without escaping them for this shell.
            { echo; cat "${notes}"; } >> release-notes.md
            echo "spliced in ${notes}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::warning::no release notes at ${notes}; publishing the boilerplate only"
          else
            echo "dry run: no notes file for a dev version, as expected"
          fi

          cat >> release-notes.md <<EOF

          The files below are **executables, not packages**: no \`.deb\`, no
          \`.rpm\`, no installer, nothing to uninstall. Each is a single static
          file with no runtime to install. Download the one for your platform,
          make it executable, and run it:

          \`\`\`sh
          chmod +x ganimedes_${VERSION}_linux_amd64      # Linux and macOS only
          ./ganimedes_${VERSION}_linux_amd64 version     # ganimedes ${VERSION}
          \`\`\`

          Without the \`chmod\` you get \`Permission denied\`; a downloaded file
          carries no execute bit. Windows needs neither step. The full install
          notes, including the macOS quarantine prompt, are in the
          [README](https://github.com/${GITHUB_REPOSITORY}#install).

          ### Verify your download

          \`\`\`sh
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          (macOS has \`shasum -a 256\` instead, and BusyBox has no
          \`--ignore-missing\`; both cases are covered in the README.)

          The checksums cover the binaries as published; they are produced by the
          workflow that built them (\`.github/workflows/release.yml\`), from the
          commit this tag points at, with tests run at that same commit.

          They also live on this page, next to the binaries, so on their own they
          prove integrity and not origin. Every binary here therefore carries a
          build provenance attestation, checked against GitHub rather than
          against this page:

          \`\`\`sh
          gh attestation verify ganimedes_${VERSION}_linux_amd64 --repo ${GITHUB_REPOSITORY}
          \`\`\`

          That confirms the file was built by this workflow, from this commit, in
          this repository. It says nothing about the code being free of bugs.
          EOF
          cat release-notes.md

      - name: 🚀 Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # --verify-tag refuses to invent a tag: the tag must already exist on
          # the remote, which it does, since pushing it is what started this run.
          gh release create "${VERSION}" \
            --title "Ganimedes ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
